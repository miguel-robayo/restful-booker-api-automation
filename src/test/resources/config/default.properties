# Values shared by every environment. Precedence (highest first):
#   -Dkey  >  RB_KEY environment variable  >  config/<env>.properties  >  this file
# Never put real credentials here: they are resolved from the environment.

environments=dev,qa

auth.username=${RB_USERNAME}
auth.password=${RB_PASSWORD}

sla.booking.get.ms=2000
query.price.threshold=500
notfound.booking.id=9999999
http.timeout.ms=10000
