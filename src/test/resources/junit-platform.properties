# Any key can be overridden with -Dkey=value (JUnit Platform reads system properties first).

# --- Cucumber (API scenarios) ---
cucumber.glue=com.credibanco.qa.restfulbooker.steps,com.credibanco.qa.restfulbooker.hooks
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
# cucumber.filter.tags is set by Surefire (main job vs. -Pknown-defects)

# --- JUnit Jupiter (technical framework tests) ---
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
